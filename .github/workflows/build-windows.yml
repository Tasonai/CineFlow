name: Build Windows Installer (.exe)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Zig (Win32 x64 launcher compiler)
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Build CineFlow-Setup-2.6.6-x64.exe Installer
        run: |
          python windows/build_windows_installer.py

      - name: Upload Windows Setup Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineFlow-Setup-2.6.6-x64
          path: |
            dist/CineFlow-Setup-2.6.6-x64.exe
            dist/CineFlow.exe
