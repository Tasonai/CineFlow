name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Windows WebView2 & PyInstaller dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview

      - name: Build standalone CineFlow.exe
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "CineFlow-Windows-x64" --add-data "public;public" --add-data "backend;backend" windows/desktop_webview2.py

      - name: Upload CineFlow.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineFlow-Windows-x64
          path: dist/CineFlow-Windows-x64.exe
